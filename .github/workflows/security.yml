name: Security and supply-chain checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON_DOWNLOADS: never

jobs:
  source-secret-guard:
    name: High-confidence source secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked text files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          patterns = {
              "private-key header": re.compile("-----" + r"BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "GitHub token": re.compile(r"\bgh" + r"[pousr]_[A-Za-z0-9]{30,}\b"),
              "GitHub fine-grained token": re.compile(r"\bgithub" + r"_pat_[A-Za-z0-9_]{60,}\b"),
              "OpenAI-style token": re.compile(r"\bsk" + r"-[A-Za-z0-9]{32,}\b"),
          }
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          findings = []
          for relative in filter(None, tracked):
              path = Path(relative)
              if path.is_symlink():
                  findings.append(f"{relative}: tracked symlink requires explicit review")
                  continue
              data = path.read_bytes()
              if b"\0" in data[:8192]:
                  continue
              text = data.decode("utf-8", errors="ignore")
              for line_number, line in enumerate(text.splitlines(), 1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append(f"{relative}:{line_number}: {label}")
          if findings:
              raise SystemExit("Potential secrets detected:\n" + "\n".join(findings))
          print("No configured high-confidence pattern matched tracked text files.")
          PY
      - name: State scanner boundary
        run: >-
          echo "::notice::This lightweight guard is not a substitute for an approved
          full-history and binary secret scanner required by PUBLIC_RELEASE_CHECKLIST.md."

  dependency-and-license-inventory:
    name: Locked dependency audit and metadata inventory
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned audit frontends
        run: |
          python -m venv "${RUNNER_TEMP}/ci-tools"
          "${RUNNER_TEMP}/ci-tools/bin/python" -m pip install \
            --require-hashes --requirement requirements-ci.lock
      - name: Export the locked runtime set
        run: >-
          "${RUNNER_TEMP}/ci-tools/bin/uv" export --frozen --format requirements.txt
          --no-dev --no-emit-project
          --output-file "${{ runner.temp }}/runtime-requirements.txt"
      - name: Audit the locked runtime set
        run: >-
          "${RUNNER_TEMP}/ci-tools/bin/python" -m pip_audit --strict
          --require-hashes --disable-pip
          --requirement "${{ runner.temp }}/runtime-requirements.txt"
      - name: Install the locked project environment
        run: >-
          "${RUNNER_TEMP}/ci-tools/bin/uv" sync --frozen --python "3.12"
      - name: Export dependency license metadata for human review
        env:
          REPORT_PATH: ${{ runner.temp }}/third-party-metadata.json
        run: |
          "${RUNNER_TEMP}/ci-tools/bin/uv" run --frozen python - <<'PY'
          from importlib.metadata import distributions
          from pathlib import Path
          import json
          import os

          rows = []
          for distribution in distributions():
              metadata = distribution.metadata
              classifiers = [
                  item for item in metadata.get_all("Classifier", [])
                  if item.startswith("License ::")
              ]
              rows.append({
                  "name": metadata.get("Name") or distribution.name,
                  "version": distribution.version,
                  "license_expression": metadata.get("License-Expression") or "",
                  "license_field": metadata.get("License") or "",
                  "license_classifiers": classifiers,
              })
          rows.sort(key=lambda item: item["name"].casefold())
          Path(os.environ["REPORT_PATH"]).write_text(
              json.dumps(rows, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          missing = [row["name"] for row in rows if not any((
              row["license_expression"], row["license_field"], row["license_classifiers"]
          ))]
          if missing:
              print("::warning::Missing license metadata: " + ", ".join(missing))
          print("Metadata inventory is not a license compatibility or redistribution approval.")
          PY
      - name: Upload dependency metadata and locked set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-license-metadata
          path: |
            ${{ runner.temp }}/runtime-requirements.txt
            ${{ runner.temp }}/third-party-metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce current public-release boundary
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import tomllib

          expected_hash = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
          actual_hash = hashlib.sha256(Path("LICENSE").read_bytes()).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit("LICENSE is not the canonical Apache-2.0 text")
          notice = Path("NOTICE").read_text(encoding="utf-8").splitlines()
          if "Copyright 2026 Ding Guan" not in notice:
              raise SystemExit("NOTICE copyright does not match the approved rightsholder")
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          if project.get("license") != "Apache-2.0":
              raise SystemExit("pyproject license expression is not Apache-2.0")
          if project.get("license-files") != ["LICENSE", "NOTICE"]:
              raise SystemExit("pyproject license-files must contain LICENSE and NOTICE")
          print("Project license, notice, and package metadata are consistent.")
          PY
          if grep -Fq '"distribution_status": "NOT_APPROVED"' vendor/specs/SOURCE_MANIFEST.json; then
            echo "::warning::Vendored specifications remain NOT_APPROVED for distribution."
          fi

  artifact-surface:
    name: Tracked release-surface inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record tracked binary and evidence files
        run: |
          mkdir -p "${{ runner.temp }}/surface-reports"
          git ls-files -z | python -c 'import sys; print("".join(line + "\n" for line in sys.stdin.buffer.read().decode().split("\0") if line.endswith((".docx", ".pdf", ".png", ".xlsx", ".tar"))))' > "${{ runner.temp }}/surface-reports/tracked-binary-files.txt"
          git ls-files 'evidence/**' 'datasets/**' 'vendor/**' > "${{ runner.temp }}/surface-reports/tracked-governed-material.txt"
      - name: Upload release-surface inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracked-release-surface
          path: ${{ runner.temp }}/surface-reports/*
          if-no-files-found: error
          retention-days: 7
      - name: State artifact boundary
        run: >-
          echo "::warning::This project currently has no container release artifact.
          Container scanning is therefore not applicable to the current package surface;
          it becomes mandatory if an OCI artifact is introduced. Binary metadata and
          redistribution rights still require named human review."
