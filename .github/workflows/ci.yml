name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON_DOWNLOADS: never
  SOURCE_DATE_EPOCH: "315532800"

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml deliberately supports the controlled 3.12 lane only.
        python-version: ["3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned CI tools
        run: |
          python -m venv "${RUNNER_TEMP}/ci-tools"
          "${RUNNER_TEMP}/ci-tools/bin/python" -m pip install \
            --require-hashes --requirement requirements-ci.lock
      - name: Verify and install the locked environment
        run: |
          "${RUNNER_TEMP}/ci-tools/bin/uv" lock --check
          "${RUNNER_TEMP}/ci-tools/bin/uv" sync --frozen --python "${{ matrix.python-version }}"
      - name: Lint
        run: >-
          "${RUNNER_TEMP}/ci-tools/bin/ruff" check src tests scripts tools release
      - name: Run unit tests
        env:
          SBOM_WORKBENCH_REQUIRE_LOOPBACK_TESTS: "1"
        run: >-
          "${RUNNER_TEMP}/ci-tools/bin/uv" run --frozen python
          release/run_public_tests.py
      - name: Build and scan the explicit public-source candidate
        run: python release/build_public_candidate.py --output "${{ runner.temp }}/public-candidate"
      - name: Verify public-candidate Markdown links
        run: python release/check_public_links.py "${{ runner.temp }}/public-candidate"

  package-smoke:
    name: Build and install wheel/sdist
    needs: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned build frontend
        run: |
          python -m venv "${RUNNER_TEMP}/ci-tools"
          "${RUNNER_TEMP}/ci-tools/bin/python" -m pip install \
            --require-hashes --requirement requirements-ci.lock
      - name: Build source and wheel artifacts
        run: >-
          "${RUNNER_TEMP}/ci-tools/bin/uv" build --sdist --wheel
          --no-create-gitignore
      - name: Normalize source-distribution metadata
        run: python scripts/normalize_sdist.py dist/*.tar.gz
      - name: Install wheel into a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/package-smoke-venv"
          "${RUNNER_TEMP}/package-smoke-venv/bin/python" -m pip install dist/*.whl
      - name: Smoke-test installed entry point and required offline resources
        run: |
          mkdir -p "${RUNNER_TEMP}/package-smoke-cwd"
          cd "${RUNNER_TEMP}/package-smoke-cwd"
          "${RUNNER_TEMP}/package-smoke-venv/bin/sbom-workbench" --help >/dev/null
          "${RUNNER_TEMP}/package-smoke-venv/bin/python" - <<'PY'
          from sbom_workbench.resources import ResourceError, data_root, vendor_specs_root

          owned_root = data_root()
          if not (owned_root / "schemas" / "synthetic-candidate.schema.json").is_file():
              raise SystemExit("Installed artifact is missing its project-owned schema closure")
          try:
              vendor_specs_root()
          except ResourceError:
              pass
          else:
              raise SystemExit("Installed public artifact unexpectedly resolves rights-restricted vendor specs")
          print("Project-owned resources are installed; vendor specs fail closed pending BYO review.")
          PY
      - name: State distribution boundary
        run: |
          echo "::notice::CI is verification-only and never uploads wheel/sdist. Distribution requires a separately reviewed, exact-hash release operation."
